name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # check runs in the Ubuntu 24.04 build image, build in the tarball image,
  # flatpak in the Flatpak image.
  CI_TARGETS: ubuntu-24.04-amd64,linux-amd64,flatpak-amd64

jobs:
  images-plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}
      image_map: ${{ steps.images.outputs.image_map }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: images
        run: go run ./tools/dwb images --github-output --registry "ghcr.io/${GITHUB_REPOSITORY}/build" --targets "$CI_TARGETS"

  images:
    needs: images-plan
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      images: ${{ needs.images-plan.outputs.images }}

  check:
    needs: [images-plan, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ fromJSON(needs.images-plan.outputs.image_map)['ubuntu-24.04-amd64'] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout (owned by another user in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-go-cached
        with:
          key: ci-check
      - name: VERSION is X.Y.Z or X.Y.Z-suffix
        run: grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' VERSION
      - name: Validate manifests and build matrix
        run: go run ./tools/dwb validate && go run ./tools/dwb targets
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
      - name: Vet (linux + windows)
        run: |
          go vet -tags gtk3 ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -tags gtk3 ./...
      - name: Changed widgets bump their version
        if: github.event_name == 'pull_request'
        run: go run ./tools/dwb check-versions --base origin/${{ github.base_ref }}

  # Compiles and packages every unit for the Linux tarball and the Windows
  # zip so packaging problems show up before a release.
  build:
    needs: [images-plan, images, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ fromJSON(needs.images-plan.outputs.image_map)['linux-amd64'] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cached
        with:
          key: ci-build
      - run: go run ./tools/dwb build --target linux-amd64 --out dist
      - run: go run ./tools/dwb build --target windows-amd64 --formats zip --out dist

  # Packages one widget as a Flatpak, so the Flatpak path is tested before a
  # release. Shares its Go cache key with the release's flatpak target.
  flatpak:
    needs: [images-plan, images, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ fromJSON(needs.images-plan.outputs.image_map)['flatpak-amd64'] }}
      options: --privileged
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cached
        with:
          key: flatpak-amd64
      - run: go run ./tools/dwb build --target flatpak-amd64 --widgets clock --out dist
